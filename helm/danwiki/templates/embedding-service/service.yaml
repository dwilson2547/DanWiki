apiVersion: v1
kind: Service
metadata:
  name: {{ include "danwiki.fullname" . }}-embedding-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "danwiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-service
spec:
  selector:
    {{- include "danwiki.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-service
  ports:
    - port: 8001
      targetPort: 8001
