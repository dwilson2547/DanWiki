apiVersion: v1
kind: Service
metadata:
  name: {{ include "danwiki.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "danwiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "danwiki.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - port: 5000
      targetPort: 5000
