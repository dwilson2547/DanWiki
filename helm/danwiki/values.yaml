image:
  repository: dwilson2547
  tag: latest
  pullPolicy: Always

# Public (Traefik pubsecure, letsencrypt-prod, external-dns). Sign-in is through authentik.
ingress:
  host: danwiki.danwils.com
  tlsSecretName: danwiki-danwils-tls

database:
  host: postgres-pgvector.postgres.svc.cluster.local
  port: 5432
  name: wiki_db
  secretName: danwiki-db-credentials   # key: DATABASE_URL

appSecrets:
  secretName: danwiki-app-secrets       # keys: SECRET_KEY, JWT_SECRET_KEY

cors:
  origins: "https://danwiki.danwils.com"

# authentik OIDC client (cluster_config authentik/blueprints/danwiki.yaml).
# Redirect URI and UI URL derive from ingress.host.
oidc:
  issuer: https://auth.danwils.com/application/o/danwiki/
  clientId: danwiki
  secretName: danwiki-oidc              # key: client_secret
  adminGroup: danwiki-admins
  creatorGroup: danwiki-creators

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  dimension: "384"

uploads:
  storageClass: nfs-dataset
  storageSize: 20Gi

redis:
  storageClass: nfs-dataset
  storageSize: 1Gi

tagging:
  enabled: false
  secretName: danwiki-tagging-secrets   # key: API_TOKEN

backend:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

worker:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

embeddingService:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
